# Which tenants exist and which one this instance runs — the routesphere
# convention, read by seed-config (system properties -D... override).
tenants[0].name=btcl
tenants[0].enabled=true
tenants[0].profile=dev
active.tenant=btcl

# The session machines start only when this is true — same convention as
# routesphere.call.gpm-v2-enabled / routesphere.sms.v2-enabled.
wifi.v2-enabled=true

quarkus.banner.enabled=false
