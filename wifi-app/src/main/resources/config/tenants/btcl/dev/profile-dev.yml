# btcl / dev — the pilot gateway (wifi-gw1). Deployed boxes override this tree
# via -Dseed.config.dir=/etc/wifi-sphere (file-by-file), never by rebuilding.
wifi:
  session:
    initTimeoutSec: 120        # seen but never probed -> REJECTED (silent)
    signalingTimeoutSec: 300   # probed but never authed -> REJECTED (noAuth)
    probingChildSec: 280       # child window, strictly below signalingTimeoutSec
    sessionMaxSec: 86400       # 24h hard cap on an authenticated session
  registry:
    poolSize: 512
    maxConcurrent: 5000
    threads: 2
  contextPlane:
    gatewayId: wifi-gw1          # dev = the pilot box; prod profile says bras-1
    configUrl: ""                # orchestrix gateway-config endpoint; "" = cache/offline mode
    tokenFile: "/etc/wifi-sphere/config-token"
    cacheFile: "/var/lib/wifi-sphere/desired-state.json"
    pollSeconds: 300             # reliable floor under the doorbell
  applier:
    enabled: false               # SHADOW: the pilot authorizer still owns the box; flip at cutover
    vppctl: "vppctl -s /run/vpp/cli.sock"
    stateFile: "/var/lib/wifi-sphere/mac-auth.json"
    expirySweepSeconds: 5
    driftSweepSeconds: 60
